name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  NX_DAEMON: false

permissions:
  contents: read
  actions: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          # Prefer a PAT when available so nx-set-shas can read workflow history.
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: master

      - name: Lint affected
        run: yarn nx affected -t lint --parallel=3

      - name: Test affected
        run: yarn nx affected -t test --parallel=3 --configuration=ci

      - name: Build affected
        run: yarn nx affected -t build --parallel=3

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build library
        run: yarn nx run ngrx-fsm:build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          yarn nx run ngrx-fsm:release
          yarn semantic-release-plus
